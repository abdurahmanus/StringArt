<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <form action="/generate/" method="post" enctype="multipart/form-data">
      <label class="block">
        image
        <input type="file" name="input_file" accept="image/*" />
      </label>
      <label class="block">
        side_len
        <input type="number" name="side_len" value="500" min="300" />
      </label>
      <label class="block">
        nail_step
        <input type="number" name="nail_step" step="1" value="4" min="1" />
      </label>
      <label class="block">
        export_strength
        <input
          type="number"
          name="export_strength"
          step="0.01"
          value="0.1"
          min="0.01"
        />
      </label>
      <label class="block">
        wb
        <input type="checkbox" name="wb" />
      </label>
      <label class="block">
        rgb
        <input type="checkbox" name="rgb" />
      </label>
      <label class="block">
        rect
        <input type="checkbox" name="rect" />
      </label>
      <button class="border bg-blue-100 p-2" type="submit">Upload</button>
    </form>
  </body>
</html>
